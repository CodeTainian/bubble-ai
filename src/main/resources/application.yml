spring:
  profiles:
    active: local
  application:
    name: bubble-ai-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bubble_ai_backend
    username: root
    password: rooter
  #redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  session:
    timeout: 2592000s
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true
        max-age: 2592000
#springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.bubble.bubbleai.controller

#knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
