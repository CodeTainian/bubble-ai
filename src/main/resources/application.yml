spring:
  profiles:
    active: local
  application:
    name: bubble-ai-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bubble_ai_backend
    username: root
    password: rooter
  #redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600 # 缓存过期时间（秒）
      database: 0
  session:
    timeout: ${SPRING_SESSION_TIMEOUT:2h}
    redis:
      # 单体和微服务使用不同命名空间，便于定位来源并避免相互污染。
      namespace: "${SPRING_SESSION_REDIS_NAMESPACE:bubble-ai:monolith:session}"
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        # 线上为 HTTPS；本地 HTTP 开发时通过 SESSION_COOKIE_SECURE=false 覆盖。
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
#springdoc-openapi
springdoc:
  # 文档默认关闭；本地需要时同时显式开启 Springdoc 与 Knife4j。
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
  group-configs:
    - group: 'default'
      packages-to-scan: com.bubble.bubbleai.controller

#knife4j
knife4j:
  # Knife4j 4.4.0 的 BasicAuth Filter 会对每个请求调用 getSession()。
  # 如需本地文档可显式设为 true；线上应保持 false，并由网关保护文档入口。
  enable: ${KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn

app:
  preview-base-url: ${APP_PREVIEW_BASE_URL:http://localhost:8123/api/static}
  cleanup:
    cron: ${APP_CLEANUP_CRON:0 0 3 * * ?}
    batch-size: ${APP_CLEANUP_BATCH_SIZE:100}

bubble-ai:
  session:
    # 临时诊断开关：定位完成后在环境变量中设为 false。
    creation-log-enabled: ${SESSION_CREATION_LOG_ENABLED:true}
  generation:
    react:
      install-timeout-seconds: ${REACT_INSTALL_TIMEOUT_SECONDS:300}
      build-timeout-seconds: ${REACT_BUILD_TIMEOUT_SECONDS:180}
      repair-ai-timeout-seconds: ${REACT_REPAIR_AI_TIMEOUT_SECONDS:240}
      max-repair-attempts: ${REACT_MAX_REPAIR_ATTEMPTS:3}
      max-build-log-length: ${REACT_MAX_BUILD_LOG_LENGTH:20000}
      stop-on-repeated-error: ${REACT_STOP_ON_REPEATED_ERROR:true}

#Actuator配置，暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
