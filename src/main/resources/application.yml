spring:
  profiles:
    active: local
  application:
    name: bubble-ai-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bubble_ai_backend
    username: root
    password: rooter
  #redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600 # 缓存过期时间（秒）
      database: 0
  session:
    timeout: 2592000s
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        #设置30天过期
        # HTTP 部署默认使用 lax + 非 secure，否则浏览器会拒绝保存 session cookie
        # 若部署为 HTTPS 且前后端跨站访问，可通过环境变量改为 none + true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        max-age: 2592000
#springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.bubble.bubbleai.controller

#knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  preview-base-url: ${APP_PREVIEW_BASE_URL:http://localhost:8123/api/static}
  cleanup:
    cron: ${APP_CLEANUP_CRON:0 0 3 * * ?}
    batch-size: ${APP_CLEANUP_BATCH_SIZE:100}

bubble-ai:
  generation:
    react:
      install-timeout-seconds: ${REACT_INSTALL_TIMEOUT_SECONDS:300}
      build-timeout-seconds: ${REACT_BUILD_TIMEOUT_SECONDS:180}
      repair-ai-timeout-seconds: ${REACT_REPAIR_AI_TIMEOUT_SECONDS:240}
      max-repair-attempts: ${REACT_MAX_REPAIR_ATTEMPTS:3}
      max-build-log-length: ${REACT_MAX_BUILD_LOG_LENGTH:20000}
      stop-on-repeated-error: ${REACT_STOP_ON_REPEATED_ERROR:true}

#Actuator配置，暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
