spring:
  profiles:
    active: local
  application:
    name: bubble-ai-app
  # session
  session:
    store-type: redis
    # 30 days expire
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bubble_ai_backend
    username: root
    password: rooter
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600
server:
  port: 8125
  servlet:
    context-path: /api
    # 30 days expire
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.bubble.bubbleai.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 分布式定时任务
app:
  preview-base-url: ${APP_PREVIEW_BASE_URL:http://localhost:8123/api/static}
  cleanup:
    cron: ${APP_CLEANUP_CRON:0 0 3 * * ?}
    batch-size: ${APP_CLEANUP_BATCH_SIZE:100}
