spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: bubble-ai-app
  # session
  session:
    store-type: redis
    # 30 days expire
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bubble_ai_backend?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  # redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ttl: ${SPRING_DATA_REDIS_TTL:3600}
server:
  port: ${SERVER_PORT:8125}
  servlet:
    context-path: /api
    # 30 days expire
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.bubble.bubbleaiapp.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 分布式定时任务
app:
  preview-base-url: ${APP_PREVIEW_BASE_URL:http://localhost:8125/api/static}
  cleanup:
    cron: ${APP_CLEANUP_CRON:0 0 3 * * ?}
    batch-size: ${APP_CLEANUP_BATCH_SIZE:100}

code:
  deploy-host: ${CODE_DEPLOY_HOST:http://localhost:8080/api/static}

bubble-ai:
  generation:
    react:
      install-timeout-seconds: ${REACT_INSTALL_TIMEOUT_SECONDS:300}
      build-timeout-seconds: ${REACT_BUILD_TIMEOUT_SECONDS:180}
      repair-ai-timeout-seconds: ${REACT_REPAIR_AI_TIMEOUT_SECONDS:240}
      max-repair-attempts: ${REACT_MAX_REPAIR_ATTEMPTS:3}
      max-build-log-length: ${REACT_MAX_BUILD_LOG_LENGTH:20000}
      stop-on-repeated-error: ${REACT_STOP_ON_REPEATED_ERROR:true}


# Dubbo
dubbo:
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848?username=nacos&password=nacos}
    register-mode: instance
  protocol:
    name: tri
    port: ${DUBBO_PROTOCOL_PORT:50053}
  consumer:
    timeout: 60000
  provider:
    timeout: 60000
  application:
    qos-enable: ${DUBBO_APPLICATION_QOS_ENABLE:true}
    qos-port: ${DUBBO_APPLICATION_QOS_PORT:3333}
