spring:
  application:
    name: bubble-ai-user
  # session
  session:
    store-type: redis
    timeout: ${SPRING_SESSION_TIMEOUT:2h}
    redis:
      # user 与 app 服务必须共享同一命名空间，才能共享登录态。
      namespace: "${SPRING_SESSION_REDIS_NAMESPACE:bubble-ai:microservice:session}"
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bubble_ai_backend?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  # redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
server:
  port: ${SERVER_PORT:8124}
  servlet:
    context-path: /api
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
# springdoc-openapi
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
  group-configs:
    - group: 'default'
      packages-to-scan: com.bubble.bubbleaiuser.controller
# knife4j
knife4j:
  # 4.4.0 的 BasicAuth Filter 会为所有请求创建 Session，默认禁用。
  enable: false
  setting:
    language: zh_cn

# Dubbo
dubbo:
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848?username=nacos&password=nacos}
    register-mode: instance
  protocol:
    name: tri
    port: ${DUBBO_PROTOCOL_PORT:50051}
  consumer:
    timeout: 60000
  provider:
    timeout: 60000
